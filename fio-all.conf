loader="uefi"
cpu=8
memory=8G

network0_type="virtio-net"
network0_switch="public"

graphics="yes"
xhci_mouse="yes"
graphics_res="1920x1080"

zfs_dataset_opts="recordsize=16K"
zfs_zvol_opts="volblocksize=16K"

disk0_name="os"
disk0_dev="sparse-zvol"
disk0_type="virtio-blk"
disk0_size="32G"

disk1_name="file-virtio.img"
disk1_dev="file"
disk1_type="virtio-blk"
disk1_size="16G"

disk2_name="file-nvme.img"
disk2_dev="file"
disk2_type="nvme"
disk2_size="16G"

disk3_name="sparse-virtio"
disk3_dev="sparse-zvol"
disk3_type="virtio-blk"
disk3_size="16G"

disk4_name="sparse-nvme"
disk4_dev="sparse-zvol"
disk4_type="nvme"
disk4_size="16G"

disk5_name="zvol-virtio"
disk5_dev="zvol"
disk5_type="virtio-blk"
disk5_size="16G"

disk6_name="zvol-nvme"
disk6_dev="zvol"
disk6_type="nvme"
disk6_size="16G"
