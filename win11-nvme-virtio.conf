loader="uefi"
uefi_vars="yes"
graphics="yes"
graphics_res="1920x1080"

cpu=8
cpu_sockets=1
cpu_cores=8
core_threads=1

memory=12G

disk0_type="nvme"
disk0_name="disk0"
disk0_dev="sparse-zvol"
disk0_size="1T"

disk1_type="virtio-blk"
disk1_name="disk1"
disk1_dev="sparse-zvol"
disk1_size="1T"

disk2_type="nvme"
disk2_name="disk2"
disk2_dev="file"
disk2_size="10G"

disk3_type="virtio-blk"
disk3_name="disk3"
disk3_dev="zvol"
disk3_size="10G"

disk4_type="ahci-cd"
disk4_name="virtio-win-0.1.285.iso"
disk4_dev="file"

zfs_zvol_opts="volblocksize=16k"
xhci_mouse="yes"
utctime="no"
virt_random="yes"
network0_type="virtio-net"
network0_switch="public"
#bhyve_options="-s 1,hda,play=/dev/dsp"
